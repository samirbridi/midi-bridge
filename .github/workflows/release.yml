name: release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: fetch tags
        shell: pwsh
        run: |
          git fetch --tags --force
          git fetch origin main --force

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: git identity
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: sync main
        shell: pwsh
        run: |
          git pull --rebase origin main

      - name: version
        id: version
        shell: pwsh
        run: |
          pwsh ./bridge/tools/versioning/release.ps1 -Commit -Tag

      - name: test
        shell: pwsh
        run: |
          dotnet test ./bridge/UsbMidiBridge.sln -c Release

      - name: publish
        id: publish
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          Remove-Item -Recurse -Force $dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dist | Out-Null
          $pub = Join-Path $dist "publish"
          New-Item -ItemType Directory -Path $pub | Out-Null

          dotnet publish ./bridge/src/Bridge.Service/Bridge.Service.csproj -c Release -r win-x64 --self-contained false -o (Join-Path $pub "Bridge.Service")
          dotnet publish ./bridge/src/Bridge.Tray/Bridge.Tray.csproj -c Release -r win-x64 --self-contained false -o (Join-Path $pub "Bridge.Tray")

          $ver = "${{ steps.version.outputs.version }}"
          $build = "${{ steps.version.outputs.build }}"
          $zip = Join-Path $dist ("UsbMidiBridge-win-x64-v{0}-build{1}.zip" -f $ver, $build)
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path (Join-Path $pub "*") -DestinationPath $zip
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          $sha = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          $shaPath = "$zip.sha256"
          "$sha  $(Split-Path -Leaf $zip)" | Set-Content -Path $shaPath -Encoding ascii
          "sha256=$shaPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: push
        shell: pwsh
        run: |
          git pull --rebase origin main
          git push origin HEAD:main --follow-tags

      - name: release notes
        id: notes
        shell: pwsh
        run: |
          $lines = Get-Content ./bridge/CHANGELOG.md
          $start = ($lines | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
          if (-not $start) { throw "CHANGELOG.md sem seção de versão" }
          $startIndex = $start - 1
          $endIndex = $lines.Length
          for ($i = $startIndex + 1; $i -lt $lines.Length; $i++) {
            if ($lines[$i] -match '^## ') { $endIndex = $i; break }
          }
          $out = $lines[$startIndex..($endIndex-1)] -join "`n"
          $path = Join-Path $env:GITHUB_WORKSPACE "dist/release-notes.md"
          Set-Content -Path $path -Value $out -Encoding utf8
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            ${{ steps.publish.outputs.zip }}
            ${{ steps.publish.outputs.sha256 }}
